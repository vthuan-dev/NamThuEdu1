name: Deploy Backend to VPS

# Tự động deploy backend lên VPS mỗi khi có thay đổi push lên nhánh main.
# Có thể chạy thủ công qua tab Actions (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# Không chạy chồng nhiều lần deploy cùng lúc
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          # Kết nối SSH: tăng timeout + retry khi VPS/network chập chờn
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            bash /var/www/namthuedu/deploy.sh
            # ── Dọn sạch cache sau khi deploy để user thấy thay đổi ngay ──
            cd /var/www/namthuedu/backend
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan cache:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            # Nạp lại config cache cho hiệu năng (tùy chọn, an toàn nếu lỗi)
            php artisan config:cache || true
            echo "✅ Cleared backend caches after deploy"

      # Retry 1 lần nếu lần 1 bị timeout mạng (không fail do lỗi script)
      - name: Retry deploy if previous step failed
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 90s
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            echo "♻️ Retry deploy after previous SSH failure..."
            sleep 10
            bash /var/www/namthuedu/deploy.sh
            cd /var/www/namthuedu/backend
            php artisan optimize:clear || true
            php artisan config:clear || true
            php artisan cache:clear || true
            php artisan route:clear || true
            php artisan view:clear || true
            php artisan config:cache || true
            echo "✅ Cleared backend caches after retry deploy"

