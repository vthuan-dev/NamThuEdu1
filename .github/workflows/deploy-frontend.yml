name: Deploy Frontend to VPS

# Build frontend trên runner rồi đẩy thư mục dist lên VPS, nginx phục vụ static.
# Chạy khi có thay đổi trong frontend/ trên nhánh main, hoặc chạy tay.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/deploy-frontend-vps.sh'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Build (mode production)
        working-directory: frontend
        env:
          VITE_API_URL: https://namthuedu.vn/api
          VITE_API_BASE_URL: https://namthuedu.vn
          VITE_API_TIMEOUT: '30000'
          VITE_ADDRESS_API: https://namthuedu.vn/api/address
          VITE_APP_NAME: NamThu Education
          VITE_APP_ENV: production
          VITE_WS_URL: wss://namthuedu.vn
          VITE_WS_KEY: namthuedu
          VITE_ENABLE_MONITORING: 'true'
          VITE_ENABLE_ANALYTICS: 'true'
          VITE_ENABLE_DEBUG: 'false'
          VITE_USE_MOCK_DATA: 'false'
          # Groq AI — transcribe audio (Whisper), parse PDF, gợi ý Speaking.
          # Key là build-time (Vite inline vào bundle). Thêm secret VITE_GROQ_API_KEY
          # trong: GitHub repo → Settings → Secrets and variables → Actions.
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: openai/gpt-oss-120b
        run: pnpm run build

      - name: Package dist
        run: tar -czf dist.tar.gz -C frontend/dist .

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: dist.tar.gz
          target: /var/www/namthuedu-fe
          timeout: 120s
          command_timeout: 15m

      - name: Upload deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: scripts/deploy-frontend-vps.sh
          target: /tmp/namthuedu-deploy
          strip_components: 1
          timeout: 60s
          command_timeout: 5m

      # Script nằm trong repo (scripts/deploy-frontend-vps.sh), không phải file
      # chỉ tồn tại trên VPS. Backend từng dùng cách cũ và deploy fail im lặng
      # 3 ngày khi file trên server bị mất.
      - name: Swap & reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            # File đi từ Windows có thể mang CRLF, bash sẽ báo
            # "$'\r': command not found" và deploy fail vì lý do vô nghĩa.
            sed -i 's/\r$//' /tmp/namthuedu-deploy/deploy-frontend-vps.sh
            bash /tmp/namthuedu-deploy/deploy-frontend-vps.sh

